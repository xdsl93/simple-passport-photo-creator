<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#146c63">
    <meta name="description" content="Carica una foto e ottieni un PDF A4 con 9 immagini da 3,5 x 4,5 cm. Tutto offline. Facile no?">
    <title>Fototessere PDF</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <div class="intro">
          <h1 id="app-title" data-i18n="appTitle">Fototessere PDF</h1>
          <p data-i18n="description">Carica una foto e ottieni un PDF A4 con 9 immagini da 3,5 x 4,5 cm. Tutto offline. Facile no?</p>
        </div>

        <div class="tool-panel">
          <div class="size-controls" aria-label="Dimensioni fototessera" data-i18n-aria-label="sizeControls">
            <label>
              <span data-i18n="widthLabel">Larghezza cm</span>
              <input id="widthInput" type="number" inputmode="decimal" min="1" max="6" step="0.1" value="3.5">
            </label>
            <label>
              <span data-i18n="heightLabel">Altezza cm</span>
              <input id="heightInput" type="number" inputmode="decimal" min="1" max="8" step="0.1" value="4.5">
            </label>
          </div>

          <div class="upload-area" id="dropZone">
            <input id="photoInput" type="file" accept="image/*">
            <label for="photoInput" class="upload-label">
              <span class="upload-icon" aria-hidden="true">+</span>
              <span>
                <strong data-i18n="uploadTitle">Carica una foto</strong>
                <small data-i18n="uploadHint">JPG, PNG o immagine dalla fotocamera</small>
              </span>
            </label>
          </div>

          <div class="preview-area" id="previewArea" hidden>
            <div class="preview-frame">
              <canvas id="previewCanvas" width="700" height="900" aria-label="Anteprima fototessera" data-i18n-aria-label="previewCanvas"></canvas>
            </div>
            <div class="photo-actions">
              <button id="removeButton" class="button button-secondary" type="button" data-i18n="removeButton">Elimina</button>
              <button id="pdfButton" class="button button-primary" type="button" data-i18n="pdfButton">Genera PDF</button>
            </div>
          </div>

          <p class="status" id="statusMessage" role="status" aria-live="polite"></p>
        </div>
      </section>

      <footer class="app-footer">
        <label class="language-control">
          <span data-i18n="languageLabel">Lingua</span>
          <select id="languageSelect" aria-label="Lingua" data-i18n-aria-label="languageLabel">
            <option value="it">Italiano</option>
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </label>
        <button id="installButton" class="button install-button" type="button" data-i18n="installButton">Installa app</button>
      </footer>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
